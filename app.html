<title>Lesson 7 영어 공부방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: an exercise-notebook page. Ruled header band, tab strip, then cards on
   English 4-line guides (blue/pink like the worksheet). Dark = chalkboard. */
:root{
  --paper:#fbfcff; --card:#ffffff; --ink:#1d2a4a; --muted:#5d6888;
  --rule:#9cc3ec; --rule-pink:#f19ab6; --accent:#ffcf3f; --accent-ink:#2a2200;
  --good:#1f9d63; --bad:#d6455d; --line:#dfe6f3; --soft:#eef4fd;
  --f-en:"Andika","Comic Sans MS",system-ui,sans-serif;
  --f-title:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-ko:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17302a; --card:#1f3d35; --ink:#eef3ea; --muted:#a9bdb4;
  --rule:#5f93c4; --rule-pink:#c46a89; --accent:#ffd659; --accent-ink:#2a2200;
  --good:#4fd39a; --bad:#ff7d91; --line:#2f5248; --soft:#24463d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17302a; --card:#1f3d35; --ink:#eef3ea; --muted:#a9bdb4;
  --rule:#5f93c4; --rule-pink:#c46a89; --accent:#ffd659; --accent-ink:#2a2200;
  --good:#4fd39a; --bad:#ff7d91; --line:#2f5248; --soft:#24463d; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ko);font-size:17px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;border-bottom:3px double var(--rule);padding-bottom:12px}
header.top h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(26px,6vw,38px);line-height:1.1;text-wrap:balance}
header.top h1 .en{font-family:var(--f-en);font-weight:700;color:var(--muted);font-size:.55em;display:block;letter-spacing:.02em}
header.top p{margin:0;color:var(--muted);font-size:15px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
nav.tabs a{min-width:0;white-space:nowrap;text-align:center;text-decoration:none;color:var(--ink);font-family:var(--f-title);font-size:clamp(14px,4vw,17px);padding:8px 4px;border-radius:999px;border:2px solid var(--line);background:var(--card)}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,.wcard:focus-visible{outline:3px solid var(--rule);outline-offset:2px}
section[data-view]{display:flex;flex-direction:column;gap:16px}
.lead{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;min-height:44px}
button:hover{border-color:var(--rule)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-title);font-size:19px}
button svg{width:20px;height:20px;flex:none}
.small{font-size:15px;min-height:40px;padding:6px 12px}

/* 4-line English guide */
/* line positions (--l1..--l4) are measured from the font in alignLines():
   l1 = top of b/d/l, l2 = top of x (dashed), l3 = baseline (red), l4 = bottom of g/p/y */
.lines{font-family:var(--f-en);padding:0 .2em;line-height:var(--lh,1.5em);
  --l1:.22em; --l2:.55em; --l3:1.05em; --l4:1.3em;
  background:
   linear-gradient(var(--rule),var(--rule)) 0 var(--l1)/100% 1px no-repeat,
   linear-gradient(90deg,var(--rule) 50%,transparent 0) 0 var(--l2)/8px 1px repeat-x,
   linear-gradient(var(--rule-pink),var(--rule-pink)) 0 var(--l3)/100% 1px no-repeat,
   linear-gradient(var(--rule),var(--rule)) 0 var(--l4)/100% 1px no-repeat}

/* Word cards: tap anywhere to hear */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wcard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer;text-align:center;position:relative}
.wcard:hover{border-color:var(--rule)}
.wcard.playing{border-color:var(--accent);background:var(--soft)}
.wcard .num{position:absolute;top:6px;left:10px;font-family:var(--f-en);color:var(--muted);font-size:13px}
.wcard .spk{position:absolute;top:8px;right:10px;color:var(--muted);width:18px;height:18px}
.pic{height:96px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;overflow:hidden}
.pic img{max-height:96px;max-width:100%;object-fit:contain}
.pic .capq{font-family:var(--f-en);font-size:18px;color:#1d2a4a;font-weight:700}
.bl{display:inline-block;width:0;height:0;vertical-align:baseline}
.wcard .word{font-size:34px;font-weight:700;white-space:nowrap}
.wcard .ko{font-size:16px;color:var(--muted)}

.ghead{grid-column:1/-1;margin:8px 0 0;font-family:var(--f-title);font-weight:400;font-size:22px;border-bottom:2px dashed var(--rule);padding-bottom:4px}
/* Sentences */
.slist{display:flex;flex-direction:column;gap:10px}
.sent{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:96px 1fr;gap:4px 12px;align-items:center}
.sent .pic{height:72px;grid-row:span 3}
.sent .pic img{max-height:72px}
.sent .top{font-size:14px;color:var(--muted)}
.sent .top b{font-family:var(--f-en);color:var(--ink);font-size:16px}
.sent .en{font-family:var(--f-en);font-size:clamp(21px,5vw,27px);font-weight:700;min-width:0}
.sent .en mark{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 .15em}
.sent .ko{color:var(--muted);font-size:15px}
.sent .row{grid-column:2}
.sent.playing{border-color:var(--accent)}
@media (max-width:420px){.sent{grid-template-columns:72px 1fr}.sent .pic{height:60px}.sent .pic img{max-height:60px}}

/* Blank-filling test */
.tlist{display:flex;flex-direction:column;gap:10px}
.trow{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:34px 96px 1fr;gap:6px 12px;align-items:center}
.trow .n{font-family:var(--f-title);font-size:22px;text-align:center}
.trow .pic{height:72px}
.trow .pic img{max-height:72px}
.trow .q{font-family:var(--f-en);font-size:clamp(19px,4.6vw,24px);font-weight:700;min-width:0;line-height:1.7}
.trow .ko{font-size:15px;color:var(--muted);font-family:var(--f-ko);font-weight:400;line-height:1.4}
.trow .hint{color:var(--bad);font-size:14px;font-family:var(--f-ko);font-weight:400}
.blank{display:inline-block;width:5.5em;max-width:100%;height:1.1em;vertical-align:-.15em;border-bottom:3px solid var(--rule-pink);margin:0 .15em}
@media (max-width:420px){.trow{grid-template-columns:28px 64px 1fr;gap:6px 8px}.trow .pic{height:54px}.trow .pic img{max-height:54px}}

.warn{background:var(--soft);border-left:4px solid var(--rule-pink);padding:10px 12px;border-radius:8px;font-size:15px}
</style>

<div class="wrap">
  <header class="top">
    <h1><span class="en">Lesson 7 · Is this your cap?</span>영어 공부방</h1>
    <p>단어 듣기 → 문장 듣기 → 공책에 쓰기</p>
  </header>

  <nav class="tabs" aria-label="메뉴">
    <a href="#words" data-tab="words">① 단어</a>
    <a href="#sentences" data-tab="sentences">② 문장</a>
    <a href="#test" data-tab="test">③ 빈칸 채우기</a>
  </nav>

  <p id="ttsWarn" class="warn" hidden>이 기기에서는 영어 소리가 안 나올 수 있어요. 크롬이나 사파리 브라우저로 열어 보세요.</p>

  <section data-view="words">
    <p class="lead">단어를 누르면 소리가 나와요. 듣고 따라 말해 보세요.</p>
    <div class="row">
      <button class="primary" id="playAll"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>전체 듣기</button>
      <button id="stopAll">멈추기</button>
    </div>
    <div class="grid" id="wordGrid"></div>
  </section>

  <section data-view="sentences" hidden>
    <p class="lead">각 단어가 들어간 문장이에요. <b>듣기</b>를 누르고 따라 말해 보세요.</p>
    <div class="slist" id="sentList"></div>
  </section>

  <section data-view="test" hidden>
    <p class="lead" style="color:var(--ink)">공책에 번호를 쓰고, 빈칸에 들어갈 영어 단어를 적어 보세요.</p>
    <div class="tlist" id="testList"></div>
  </section>

</div>

<script>
/*__IMAGES__*/
const IMG = window.IMG || {};

// Study items (9/nine removed, colours grouped). q = blank on the test, ex = sentence to listen to.
const ITEMS = [
 {n:1, en:"belt",   ko:"벨트",   img:"belt",   q:"Is this your ___?", ex:"Is this your belt?",  exKo:"이것은 너의 벨트니?"},
 {n:2, en:"coat",   ko:"코트",   img:"coat",   q:"Is this your ___?", ex:"Is this your coat?",  exKo:"이것은 너의 코트니?"},
 {n:3, en:"dress",  ko:"원피스", img:"dress",  q:"Is this your ___?", ex:"Is this your dress?", exKo:"이것은 너의 원피스니?"},
 {n:4, en:"jacket", ko:"재킷",   img:"jacket", q:"Is this your ___?", ex:"Is this your jacket?",exKo:"이것은 너의 재킷이니?"},
 {n:5, en:"skirt",  ko:"치마",   img:"skirt",  q:"Is this your ___?", ex:"Is this your skirt?", exKo:"이것은 너의 치마니?"},
 {n:6, en:"T-shirt",ko:"티셔츠", img:"tshirt", q:"Is this your ___?", ex:"Is this your T-shirt?",exKo:"이것은 너의 티셔츠니?"},
 {n:7, en:"very",   ko:"매우",   img:"family", q:"He's ___ small.",   ex:"He's very small.",    exKo:"그는 매우 작다."},
 {n:8, en:"small",  ko:"작은",   img:"bear",   q:"He's very ___.",    ex:"The bear is small.",  exKo:"그 곰은 작다."},
 {n:9, en:"bag",    ko:"가방",   img:"amy",    q:"Is this your ___?", ex:"Is this your bag?",   exKo:"이것은 너의 가방이니?"},
 {color:true, n:10,en:"red",    ko:"빨간색", img:"amy",    q:"No. My bag is ___.",ex:"No. My bag is red.",  exKo:"아니. 내 가방은 빨간색이야.", hint:"힌트: Amy의 가방 색깔을 보세요!"},
 {color:true, n:12,en:"black",  ko:"검정색", img:"black",  ex:"My cap is black.",   exKo:"내 모자는 검정색이야."},
 {color:true, n:15,en:"yellow", ko:"노란색", img:"yellow", ex:"It is yellow.",      exKo:"그것은 노란색이야."},
 {color:true, n:16,en:"brown",  ko:"갈색",   img:"brown",  ex:"My bag is brown.",   exKo:"내 가방은 갈색이야."},
 {n:11,en:"it",     ko:"그것",   img:null,     pre:"Is this your cap?", q:"Yes, ___ is.", ex:"Is this your cap? Yes, it is.", exKo:"이것은 네 모자니? 응, 맞아."},
 {n:13,en:"boy",    ko:"소년",   img:"boy",    ex:"He is a boy.",       exKo:"그는 소년이야."},
 {n:14,en:"That",   ko:"저것",   img:"that",   q:"___ is my cap.",      ex:"That is my cap.", exKo:"저것은 나의 모자야."},
 {n:17,en:"Mine",   ko:"내 것",  img:"mine",   q:"___ is red.",         ex:"Mine is red.",    exKo:"내 것은 빨간색이야."},
 {n:19,en:"bike",   ko:"자전거", img:"bike",   ex:"Is this your bike?", exKo:"이것은 너의 자전거니?", hint:"힌트: 네 글자"},
 {n:20,en:"like",   ko:"좋아하다", img:"like", ex:"I like it.",          exKo:"나는 그것이 좋아."},
];
ITEMS.forEach((it,i)=>it.n = i+1);   // number in study order
const COLOR_START = ITEMS.find(it=>it.color), AFTER_COLOR = ITEMS.find((it,i)=>i>0 && !it.color && ITEMS[i-1].color);
const groupHead = (it, tag) => it===COLOR_START ? `<${tag} class="ghead">색깔</${tag}>` : it===AFTER_COLOR ? `<${tag} class="ghead">다른 단어</${tag}>` : "";

/* ---------- Speech ---------- */
const synth = window.speechSynthesis;
let voice = null;
function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /Samantha|Google|Jenny|Aria|Zira/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0] || null;
}
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
else document.getElementById("ttsWarn").hidden = false;

let token = 0;
function stopSpeech(){ token++; if(synth) synth.cancel(); }
function say(text, rate=0.8, onend){
  if(!synth){ onend && onend(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; if(voice) u.voice = voice; u.rate = rate;
  if(onend) u.onend = onend;
  synth.speak(u);
}
const ICON_SPK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const pic = it => `<div class="pic">${it.img && IMG[it.img] ? `<img src="${IMG[it.img]}" alt="${it.ko}">` : `<span class="capq">cap?</span>`}</div>`;

/* ---------- ① Words: tap to hear the word ---------- */
const grid = document.getElementById("wordGrid");
const cards = ITEMS.map(it=>{
  const c = document.createElement("div");
  c.className = "wcard"; c.tabIndex = 0; c.setAttribute("role","button"); c.setAttribute("aria-label", it.en+" 듣기");
  c.innerHTML = `<span class="num">${it.n}</span><svg class="spk" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/></svg>
    ${pic(it)}<div class="word lines">${it.en}</div><div class="ko">${it.ko}</div>`;
  const play = ()=>{ stopSpeech(); cards.forEach(x=>x.classList.remove("playing")); c.classList.add("playing"); say(it.en.toLowerCase(), 0.75, ()=>c.classList.remove("playing")); };
  c.addEventListener("click", play);
  c.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); play(); } });
  grid.insertAdjacentHTML("beforeend", groupHead(it,"h2"));
  grid.appendChild(c);
  return c;
});
document.getElementById("playAll").onclick = ()=>{
  stopSpeech(); const my = token; let i = 0;
  const next = ()=>{
    cards.forEach(x=>x.classList.remove("playing"));
    if(my!==token || i>=ITEMS.length) return;
    const c = cards[i]; c.classList.add("playing"); c.scrollIntoView({block:"nearest",behavior:"smooth"});
    const w = ITEMS[i++].en.toLowerCase();
    say(w, 0.75, ()=>setTimeout(()=>{ if(my===token) say(w, 0.75, ()=>setTimeout(next, 1200)); }, 900));
  };
  next();
};
document.getElementById("stopAll").onclick = ()=>{ stopSpeech(); cards.forEach(x=>x.classList.remove("playing")); };

/* ---------- ② Sentences using each word ---------- */
const sentList = document.getElementById("sentList");
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
ITEMS.forEach(it=>{
  const d = document.createElement("article"); d.className = "sent";
  const marked = it.ex.replace(new RegExp("\\b"+esc(it.en)+"\\b"), m=>`<mark>${m}</mark>`);
  d.innerHTML = `${pic(it)}
    <div class="top">${it.n}. <b>${it.en}</b> (${it.ko})</div>
    <div class="en">${marked}</div>
    <div class="ko">${it.exKo}</div>
    <div class="row"><button class="small" data-r="0.8">${ICON_SPK}듣기</button><button class="small" data-r="0.5">천천히</button></div>`;
  d.addEventListener("click", e=>{
    const b = e.target.closest("[data-r]"); if(!b) return;
    stopSpeech(); document.querySelectorAll(".sent.playing").forEach(x=>x.classList.remove("playing"));
    d.classList.add("playing"); say(it.ex, +b.dataset.r, ()=>d.classList.remove("playing"));
  });
  sentList.insertAdjacentHTML("beforeend", groupHead(it,"h2"));
  sentList.appendChild(d);
});

/* ---------- ③ Blanks to copy into the notebook ---------- */
const testList = document.getElementById("testList");
const BLANK = '<span class="blank" aria-label="빈칸"></span>';
ITEMS.forEach(it=>{
  const ko = it.en==="red" ? "아니. 내 가방은 (　　)이야." : it.en==="it" ? "응, 맞아. (네, 그것은 나의 모자가 맞아요.)" : it.exKo;
  const q = it.q
    ? `${it.pre?it.pre+"<br>":""}${it.q.replace("___", BLANK)}<div class="ko">${ko}</div>`
    : `${BLANK}<div class="ko">${it.ko}</div>`;
  testList.insertAdjacentHTML("beforeend", groupHead(it,"h2") +
    `<div class="trow"><div class="n">${it.n}</div>${pic(it)}<div class="q">${q}${it.hint?`<div class="hint">${it.hint}</div>`:""}</div></div>`);
});

/* ---------- 4-line guide alignment ---------- */
const mctx = document.createElement("canvas").getContext("2d");
function alignLines(){
  document.querySelectorAll(".lines").forEach(el=>{
    const cs = getComputedStyle(el), F = parseFloat(cs.fontSize);
    mctx.font = `${cs.fontWeight} ${F}px ${cs.fontFamily}`;
    const asc = mctx.measureText("bdhklt").actualBoundingBoxAscent;   // tall letters
    const xh  = mctx.measureText("xzvwu").actualBoundingBoxAscent;    // small letters
    const des = mctx.measureText("gpqy").actualBoundingBoxDescent;    // tails
    const gap = (asc - xh) * 0.6;                                    // room above/below the guide
    const L = Math.ceil(asc + des + gap*2);
    el.style.setProperty("--lh", L+"px");
    // read the real baseline from the rendered line: a 0-size inline-block sits on it
    let probe = el.querySelector(".bl");
    if(!probe){ probe = document.createElement("i"); probe.className = "bl"; el.appendChild(probe); }
    const base = probe.getBoundingClientRect().top - el.getBoundingClientRect().top - el.clientTop;
    el.style.setProperty("--l1", Math.round(base-asc)+"px");
    el.style.setProperty("--l2", Math.round(base-xh)+"px");
    el.style.setProperty("--l3", Math.round(base)+"px");
    el.style.setProperty("--l4", Math.round(base+des)+"px");
  });
}
alignLines();
if(document.fonts){ document.fonts.ready.then(alignLines); document.fonts.addEventListener?.("loadingdone", alignLines); }

/* ---------- Tabs ---------- */
const VIEWS = ["words","sentences","test"];
function route(){
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "words";
  document.querySelectorAll("section[data-view]").forEach(s=>s.hidden = s.dataset.view!==v);
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.tab===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  stopSpeech();
}
window.addEventListener("hashchange", route); route();
</script>
